[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "mateloader"
version = "0.2"
description = "MateLoader: a desktop app and CLI for downloading supported Yandex Books content."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Gago Alaverdyan" },
]
keywords = ["yandex-books", "yandex", "cli", "gtk4", "libadwaita", "gnome", "downloader"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4",
  "ebooklib",
  "httpx[http2]",
  "keyring",
  "pillow",
  "reportlab",
]

[project.optional-dependencies]
auth = [
  "pywebview",
  "pywebview[qt]; sys_platform == 'linux' or sys_platform == 'darwin'",
]
gui = [
  # The desktop app is built with GTK4 + libadwaita via PyGObject.
  # GTK 4 and libadwaita themselves are system libraries; see the README for the
  # platform packages required alongside this Python dependency.
  "PyGObject>=3.46",
  "pywebview",
  "pywebview[qt]; sys_platform == 'linux' or sys_platform == 'darwin'",
]
dev = [
  "mypy",
  "ruff",
]

[project.urls]
Homepage = "https://github.com/gagoalaverdyan/MateLoader"
Repository = "https://github.com/gagoalaverdyan/MateLoader"
Issues = "https://github.com/gagoalaverdyan/MateLoader/issues"

[project.scripts]
mateloader = "mateloader.cli:main"

[project.gui-scripts]
mateloader-gui = "mateloader.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mateloader"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/requirements-cli.txt",
  "/data",
  "/scripts",
  "/src",
  "/tests",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = false
